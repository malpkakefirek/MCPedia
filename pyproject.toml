[tool.poetry]
name = "MCPedia"
version = "2.2"
description = ""
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10.0,<3.11"
numpy = "^1.22.2"
urllib3 = "^1.26.12"
py-cord = "^2.4.0"
pymediawiki = "^0.7.3"
beautifulsoup4 = "^4.12.0"
requests = "^2.31.0"
Pillow = "^10.0.0"
aiohttp = "^3.8.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
debugpy = "^1.6.2"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: contract tests against the live Minecraft Wiki API (opt-in)",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"